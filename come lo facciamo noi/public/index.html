<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TuneNest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="auth-screen">
  <div class="auth-card">
    <div class="auth-logo">🎵 E<span>Music</span></div>
    <p class="auth-subtitle">Inserisci il tuo nome per entrare</p>
    <div class="form-group" style="margin-top:28px">
      <label class="form-label">Username</label>
      <input class="form-input" id="auth-user" placeholder="Es. marco_beats" />
    </div>
    <p id="auth-hint" style="font-size:12px;color:var(--text-dim);min-height:18px;margin-bottom:16px"></p>
    <button class="btn btn-green" style="width:100%;justify-content:center" onclick="faiAutenticazione()">Entra</button>
  </div>
</div>

<div id="app" style="display:none">
  <aside id="sidebar">
    <div class="logo">🎵 <span>E</span>Music</div>
    <button class="nav-btn active"><span class="icon">📚</span> Le mie playlist</button>
  </aside>

  <main id="main">
    <div class="topbar">
      <div id="user-avatar-chip" onclick="faiLogout()">
        <div class="chip-avatar" id="chip-av">🎵</div>
        <span class="chip-name" id="chip-name">Utente</span>
        <span style="color:var(--text-dim);font-size:12px">· Esci</span>
      </div>
    </div>

    <section id="page-my-playlists" class="page active">
      <div class="page-header-row">
        <div class="page-header" style="margin-bottom:0">
          <h1>Le mie playlist</h1>
          <p>Crea e gestisci la tua musica</p>
        </div>
        <button class="btn btn-green" onclick="apriModalPlaylist()">＋ Nuova playlist</button>
      </div>
      <div id="my-playlists-grid" class="cards-grid"></div>
    </section>

    <section id="page-detail" class="page">
      <div id="detail-content"></div>
    </section>
  </main>
</div>

<!-- Modal: Crea/Modifica Playlist -->
<div class="modal-overlay" id="modal-playlist">
  <div class="modal">
    <div class="modal-title" id="modal-pl-title">Crea playlist</div>
    <input type="hidden" id="edit-pl-id" />
    <div class="form-group">
      <label class="form-label">Nome *</label>
      <input class="form-input" id="pl-name" placeholder="Es. Chill Session" />
    </div>
    <div class="form-group">
      <label class="form-label">Sottotitolo</label>
      <input class="form-input" id="pl-subtitle" placeholder="Es. Per le serate rilassanti 🌙" />
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="chiudiModal('modal-playlist')">Annulla</button>
      <button class="btn btn-green" onclick="salvaPlaylist()">Salva</button>
    </div>
  </div>
</div>

<!-- Modal: Aggiungi Canzone -->
<div class="modal-overlay" id="modal-song">
  <div class="modal">
    <div class="modal-title">Aggiungi canzone</div>
    <input type="hidden" id="song-pl-id" />
    <div class="form-group">
      <label class="form-label">Titolo *</label>
      <input class="form-input" id="song-title" placeholder="Es. Blinding Lights" />
    </div>
    <div class="form-group">
      <label class="form-label">Artista *</label>
      <input class="form-input" id="song-artist" placeholder="Es. The Weeknd" />
    </div>
    <div class="form-group">
      <label class="form-label">Durata</label>
      <input class="form-input" id="song-duration" placeholder="3:45" />
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="chiudiModal('modal-song')">Annulla</button>
      <button class="btn btn-green" onclick="salvaCanzone()">Aggiungi</button>
    </div>
  </div>
</div>

<div id="notifica"></div>

<script>
let utenteAttuale = null;
let elencoPlaylist   = [];

// Invia una richiesta HTTP al server e restituisce la risposta
async function api(metodo, endpoint, corpo = null) {
  const opzioni = { method: metodo, headers: { 'Content-Type': 'application/json' } };
  if (utenteAttuale) opzioni.headers['X-User-Id'] = utenteAttuale.id;
  if (corpo) opzioni.body = JSON.stringify(corpo);
  const r = await fetch('/api' + endpoint, opzioni);
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || 'Errore server');
  return d;
}

// Converte i caratteri speciali HTML per evitare attacchi XSS
function correggi(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Mostra una notifica temporanea in basso allo schermo
function notifica(messaggio, tipo = 'success') {
  const el = document.getElementById('notifica');
  el.textContent = messaggio;
  el.className = `show ${tipo}`;
  clearTimeout(window._t);
  window._t = setTimeout(() => el.className = '', 3000);
}

// Apre un modal aggiungendo la classe 'open'
function apriModal(id)  { document.getElementById(id).classList.add('open'); }

// Chiude un modal rimuovendo la classe 'open'
function chiudiModal(id) { document.getElementById(id).classList.remove('open'); }

// Chiude il modal se si clicca sullo sfondo scuro
document.querySelectorAll('.modal-overlay').forEach(o => o.addEventListener('click', e => { if (e.target === o) o.classList.remove('open'); }));

// Prova prima il login; se l'utente non esiste lo registra automaticamente
async function faiAutenticazione() {
  const nomeutente = document.getElementById('auth-user').value.trim();
  if (!nomeutente) return notifica('Inserisci un username', 'error');
  try {
    // Prova login solo con username
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nomeutente })
    });
    if (res.ok) {
      const dati = await res.json();
      loginRiuscito(dati.utente);
    } else {
      // Utente non trovato → lo creiamo
      const reg = await fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nomeutente, avatar: '🎧' })
      });
      if (!reg.ok) {
        const err = await reg.json();
        throw new Error(err.error || 'Errore registrazione');
      }
      const dati = await reg.json();
      loginRiuscito(dati.utente);
      notifica('Benvenuto, ' + nomeutente + '! 🎉', 'success');
    }
  } catch(e) { notifica(e.message, 'error'); }
}

// Salva l'utente, nasconde il login, mostra l'app e carica le playlist
function loginRiuscito(utente) {
  utenteAttuale = utente;
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('app').style.display = 'grid';
  document.getElementById('chip-av').textContent   = utente.avatar;
  document.getElementById('chip-name').textContent = utente.nomeutente;
  caricaPlaylist();
}

// Azzera i dati e torna alla schermata di login
function faiLogout() {
  utenteAttuale = null; elencoPlaylist = [];
  document.getElementById('app').style.display = 'none';
  document.getElementById('auth-screen').style.display = 'flex';
}

// Torna alla pagina principale Le mie playlist
function vaAllePlaylist() {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-my-playlists').classList.add('active');
  document.querySelector('.nav-btn').classList.add('active');
  mostraPlaylist();
}

// Scarica tutte le playlist dal server e aggiorna la pagina
async function caricaPlaylist() {
  try {
    elencoPlaylist = await api('GET', '/playlists');
    mostraPlaylist();
  } catch(e) { notifica('Errore caricamento', 'error'); }
}

// Genera l'HTML di una singola card playlist
function cartaPlaylist(p) {
  return `<div class="pl-card" onclick="apriDettagli('${p.id}')">
    <div class="pl-card-cover"><div class="pl-card-cover-bg"></div>${p.copertina}</div>
    <div class="pl-card-name">${correggi(p.nome)}</div>
    <div class="pl-card-subtitle">${correggi(p.sottotitolo || '')}</div>
    <div class="pl-card-meta">${p.canzoni.length} canzon${p.canzoni.length === 1 ? 'e' : 'i'}</div>
  </div>`;
}

// Genera l'HTML per il messaggio "lista vuota"
function nessunaPlaylist(icona, titolo, messaggio) {
  return `<div class="empty-state" style="grid-column:1/-1"><div class="empty-icon">${icona}</div><h3>${titolo}</h3><p>${messaggio}</p></div>`;
}

// Mostra la griglia di tutte le playlist dell'utente
function mostraPlaylist() {
  const mie = elencoPlaylist.filter(p => p.idUtente === utenteAttuale.id);
  document.getElementById('my-playlists-grid').innerHTML = mie.length
    ? mie.map(cartaPlaylist).join('')
    : nessunaPlaylist('📭', 'Ancora nessuna playlist', 'Premi <strong>＋ Nuova playlist</strong> per iniziare!');
}

// Carica dal server e mostra i dettagli e le canzoni di una playlist
async function apriDettagli(id) {
  const pl = await api('GET', '/playlists/' + id);
  const indice  = elencoPlaylist.findIndex(p => p.id === id);
  if (indice > -1) elencoPlaylist[indice] = pl;
  const proprietario = pl.idUtente === utenteAttuale.id;

  document.getElementById('detail-content').innerHTML = `
    <div class="detail-header">
      <div class="detail-cover">${pl.copertina}</div>
      <div>
        <p class="detail-type">Playlist</p>
        <h1 class="detail-name">${correggi(pl.nome)}</h1>
        <p class="detail-subtitle">${correggi(pl.sottotitolo || '')}</p>
        <p class="detail-meta">di <strong>${correggi(pl.autore?.nomeutente || '?')}</strong> &nbsp;·&nbsp; ${pl.canzoni.length} canzoni</p>
      </div>
    </div>
    <div class="detail-actions">
      <button class="btn btn-ghost" onclick="vaAllePlaylist()">← Indietro</button>
      ${proprietario ? `
        <button class="btn btn-ghost" onclick="apriModalPlaylist('${pl.id}')">✏️ Modifica</button>
        <button class="btn btn-green" onclick="apriModalCanzone('${pl.id}')">＋ Aggiungi brano</button>
        <button class="btn btn-danger btn-sm" onclick="eliminaPlaylist('${pl.id}')">🗑 Elimina</button>
      ` : ''}
    </div>
    ${pl.canzoni.length ? `
      <div class="song-row" style="pointer-events:none;margin-bottom:4px">
        <div style="color:var(--text-dim);font-size:11px">#</div>
        <div style="color:var(--text-dim);font-size:11px">TITOLO</div>
        <div style="color:var(--text-dim);font-size:11px">ARTISTA</div>
        <div style="color:var(--text-dim);font-size:11px;text-align:right">⏱</div>
        <div></div>
      </div>
      <div class="divider" style="margin:0 0 8px"></div>
      ${pl.canzoni.map((s, indice) => `
        <div class="song-row">
          <div class="song-num">${indice + 1}</div>
          <div class="song-title">${correggi(s.titolo)}</div>
          <div class="song-artist">${correggi(s.artista)}</div>
          <div class="song-duration">${correggi(s.durata || '—')}</div>
          <div>${proprietario ? `<button class="song-delete-btn" onclick="eliminaCanzone('${pl.id}','${s.id}')">✕</button>` : ''}</div>
        </div>`).join('')}
    ` : `<div class="empty-state"><div class="empty-icon">🎵</div><h3>Playlist vuota</h3><p>${proprietario ? 'Aggiungi il primo brano!' : 'Nessuna canzone.'}</p></div>`}
  `;

  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-detail').classList.add('active');
  document.querySelector('.nav-btn').classList.remove('active');
}

// ── PLAYLIST CRUD ───────────────────────────────────

// Apre il modal per creare una nuova playlist o modificarne una esistente
function apriModalPlaylist(idModifica = null) {
  document.getElementById('modal-pl-title').textContent = idModifica ? 'Modifica playlist' : 'Crea playlist';
  document.getElementById('edit-pl-id').value = idModifica || '';
  const pl = idModifica ? elencoPlaylist.find(p => p.id === idModifica) : null;
  document.getElementById('pl-name').value     = pl ? pl.nome     : '';
  document.getElementById('pl-subtitle').value = pl ? pl.sottotitolo : '';
  apriModal('modal-playlist');
}

// Salva la playlist: la crea se è nuova, la aggiorna se esiste già
async function salvaPlaylist() {
  const idModifica   = document.getElementById('edit-pl-id').value;
  const nome     = document.getElementById('pl-name').value.trim();
  const sottotitolo = document.getElementById('pl-subtitle').value.trim();
  if (!nome) return notifica('Il nome è obbligatorio', 'error');
  try {
    if (idModifica) {
      const aggiornata = await api('PUT', '/playlists/' + idModifica, { nome, sottotitolo });
      const indice = elencoPlaylist.findIndex(p => p.id === idModifica);
      if (indice > -1) elencoPlaylist[indice] = { ...elencoPlaylist[indice], ...aggiornata };
    } else {
      elencoPlaylist.push(await api('POST', '/playlists', { nome, sottotitolo, copertina: '🎵' }));
    }
    chiudiModal('modal-playlist');
    mostraPlaylist();
    notifica(idModifica ? 'Playlist aggiornata!' : 'Playlist creata!', 'success');
  } catch(e) { notifica(e.message, 'error'); }
}

// Chiede conferma ed elimina la playlist dal server e dalla lista locale
async function eliminaPlaylist(id) {
  if (!confirm('Eliminare questa playlist?')) return;
  try {
    await api('DELETE', '/playlists/' + id);
    elencoPlaylist = elencoPlaylist.filter(p => p.id !== id);
    vaAllePlaylist();
    notifica('Playlist eliminata', 'success');
  } catch(e) { notifica(e.message, 'error'); }
}

// ── SONG CRUD ───────────────────────────────────────

// Apre il modal per aggiungere una canzone, svuotando i campi
function apriModalCanzone(idPlaylist) {
  document.getElementById('song-pl-id').value = idPlaylist;
  ['song-title','song-artist','song-duration'].forEach(id => document.getElementById(id).value = '');
  apriModal('modal-song');
}

// Legge i campi del modal e aggiunge la canzone alla playlist sul server
async function salvaCanzone() {
  const idPlaylist = document.getElementById('song-pl-id').value;
  const titolo      = document.getElementById('song-title').value.trim();
  const artista     = document.getElementById('song-artist').value.trim();
  const durata   = document.getElementById('song-duration').value.trim();
  if (!titolo || !artista) return notifica('Titolo e artista sono obbligatori', 'error');
  try {
    const canzone = await api('POST', '/playlists/' + idPlaylist + '/songs', { titolo, artista, durata });
    const pl = elencoPlaylist.find(p => p.id === idPlaylist);
    if (pl) pl.canzoni.push(canzone);
    chiudiModal('modal-song');
    apriDettagli(idPlaylist);
    notifica('Canzone aggiunta!', 'success');
  } catch(e) { notifica(e.message, 'error'); }
}

// Rimuove una canzone dalla playlist sul server e aggiorna la vista
async function eliminaCanzone(idPlaylist, idCanzone) {
  try {
    await api('DELETE', '/playlists/' + idPlaylist + '/songs/' + idCanzone);
    const pl = elencoPlaylist.find(p => p.id === idPlaylist);
    if (pl) pl.canzoni = pl.canzoni.filter(s => s.id !== idCanzone);
    apriDettagli(idPlaylist);
    notifica('Canzone rimossa', 'success');
  } catch(e) { notifica(e.message, 'error'); }
}


</script>
</body>
</html>
